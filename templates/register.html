{% extends 'base.html' %}{% block title %}Register{% endblock %}
{% block body %}
<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:2rem;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(0,212,255,.05) 0%,transparent 70%)">
  {% include '_alerts.html' %}
  <div class="auth-card" style="max-width:500px">
    <div style="text-align:center;margin-bottom:1.5rem">
      <a href="/" style="font-family:var(--font-display);font-size:1.8rem;font-weight:700;color:#fff">Glitch<span class="brand-accent">Fix</span></a>
    </div>
    <div class="auth-card__title">Create Account</div>
    <div class="auth-card__sub">Join GlitchFix and get your PC issues resolved</div>
    <form method="POST">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" name="name" class="form-control" placeholder="Amit Kulkarni" required>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="text" name="phone" class="form-control" placeholder="9876543210">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address *</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Password *</label>
          <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password *</label>
          <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-full" style="justify-content:center;margin-top:.5rem"><i class="fa-solid fa-user-plus"></i> Create Account</button>
    </form>
    <div class="divider-or">or</div>
    <div style="text-align:center;font-size:.875rem;color:var(--text-muted)">Already have an account? <a href="/login">Sign in</a></div>
  </div>
</div>
{% endblock %}
